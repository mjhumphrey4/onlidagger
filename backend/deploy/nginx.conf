# Install as /etc/nginx/sites-available/onlidagger; enable in sites-enabled.
# Use a TLS server block/certificate before connecting remote MT5 terminals.
server {
    listen 80;
    server_name mt5.example.com;
    root /var/www/onlidagger/frontend/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # EA endpoints use a per-account bearer token and require TLS remotely.
    location ^~ /api/ea/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/onlidagger/backend/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Keep the anonymous browser API and frontend private to the operator VPN.
    location ^~ /api/ {
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/onlidagger/backend/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
    location ~ /\. { deny all; }
}
