# Install as /etc/nginx/sites-available/onlidagger; enable in sites-enabled.
# Use a TLS server block/certificate before connecting remote MT5 terminals.
server {
    listen 80;
    server_name mt5.example.com;
    root /var/www/onlidagger/public;
    index index.php;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # EA endpoints use a per-account bearer token and require TLS remotely.
    location ^~ /api/ea/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # No login screen: restrict the dashboard AND its API at the network boundary.
    # This example permits localhost and Tailscale. Replace with your admin IP/VPN.
    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
